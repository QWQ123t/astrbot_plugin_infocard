name: astrbot_plugin_infocard
display_name: 信息卡片
desc: QQ资料卡片 + 群管工具。/开盒 @群友 查看资料卡片；群管支持 禁言/解禁/全禁/踢人/管理员 设置，进群审核（自动艾特管理员，同意/拒绝/拉黑 一键处理），表情包刷屏自动禁言。
help: |
  资料卡片：/开盒 @群友 或 /开盒 QQ号，展示资料卡片，可自动开盒新群友与退群成员。
  群管指令：/禁言  @用户、/解禁 @用户、/全禁 开|关、/踢人 @用户、/管理员 @用户、/群审核 开|关。
  进群审核：开启后有人申请进群自动艾特全体管理员并给出编号，管理员回复 同意  / 拒绝  / 拉黑  即可处理，拉黑后再次申请自动拒绝。
  刷屏防护：开启后，群成员在窗口时间内连续发送表情包达到上限将自动禁言（可配置上限/窗口/时长）。
version: v1.1.0
author: 摆烂的四不相
repo: https://github.com/QWQ123t/astrbot_plugin_infocard
support_platforms:
  aiocqhttp
astrbot_version: ">=4.0.0"
